name: AliExpress Telegram Bot

on:
  schedule:
    - cron: "*/30 6-21 * * *"
  workflow_dispatch:
    inputs:
      focus:
        description: "أقسام بس (مثل: evening-dresses,dresses,bags)"
        required: false
        default: ""
      count:
        description: "عدد المنشورات"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: post-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post one product
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python bot.py post --count "${{ inputs.count || 4 }}" --focus "${{ inputs.focus }}"
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
