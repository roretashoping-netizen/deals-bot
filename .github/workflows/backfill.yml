name: Backfill site

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: post-bot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Add old products to site
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
        run: python bot.py backfill
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs || true
          git diff --cached --quiet || (git commit -m "backfill site" && git pull --rebase && git push)
