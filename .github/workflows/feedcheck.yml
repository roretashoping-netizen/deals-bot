name: Check Admitad feeds

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check feeds (no posting)
        env:
          ADMITAD_FEED_JFN: ${{ secrets.ADMITAD_FEED_JFN }}
          ADMITAD_FEED_STYLEWE: ${{ secrets.ADMITAD_FEED_STYLEWE }}
          ADMITAD_FEED_NORACORA: ${{ secrets.ADMITAD_FEED_NORACORA }}
        run: python bot.py feedcheck
